name: Test

on: [push, pull_request, workflow_dispatch, workflow_call]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2
    - name: Install modules
      run: yarn install --frozen-lockfile
    - name: Run linters
      run: yarn run check
